<!doctype html>
<html lang="nn" data-title="nd.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Non-dimensional frequency</title>
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/nondim.css">
<script src="assets/site.js"></script>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="wrap">
  <h1 data-i18n="nd.h1"></h1>
  <p class="sub" data-i18n="nd.sub"></p>

  <div class="card essence">
    <h2 data-i18n="nd.ess_h"></h2>
    <ol>
      <li data-i18n="nd.e1"></li>
      <li data-i18n="nd.e2"></li>
      <li data-i18n="nd.e3"></li>
      <li data-i18n="nd.e4"></li>
    </ol>
  </div>

  <div class="card">
    <h2 data-i18n="nd.ctl_h"></h2>
    <div class="row"><label for="oh">&omega;&#770;</label><input id="oh" type="range" min="0.1" max="2" step="0.1" value="1"><output id="oho"></output></div>
    <div class="chips">
      <span class="chip on" id="modeNd" data-i18n="nd.mode_nd"></span>
      <span class="chip" id="modeDim" data-i18n="nd.mode_dim"></span>
      <button id="play"></button>
    </div>
    <div class="infobox" id="modenote"></div>
    <div class="insight" id="insight"></div>
  </div>

  <div class="boxes" id="boxes"></div>
  <p class="small" id="note"></p>

  <div class="card">
    <h2 data-i18n="nd.tbl_h"></h2>
    <div class="tscroll" id="tbl"></div>
    <p class="small" data-i18n="nd.tbl_note"></p>
  </div>

  <div class="card">
    <h2 data-i18n="nd.fm_h"></h2>
    <div class="fm"><span class="eq2">&omega;&#770; = &omega; &middot; &radic;(B / 2g)</span><span class="small" data-i18n="nd.fm1"></span></div>
    <div class="fm"><span class="eq2">&omega; = &omega;&#770; &middot; &radic;(2g / B),&nbsp; T = 2&pi; / &omega;</span><span class="small" data-i18n="nd.fm2"></span></div>
    <div class="fm"><span class="eq2">&lambda; = 2&pi;g / &omega;&sup2;</span><span class="small" data-i18n="nd.fm3"></span></div>
    <div class="fm"><span class="eq2">&lambda; / B = &pi; / &omega;&#770;&sup2;</span><span class="small" data-i18n="nd.fm4"></span></div>
  </div>

  <div class="card tryit">
    <h2 data-i18n="nd.try_h"></h2>
    <p data-i18n="nd.try"></p>
  </div>
</div>
</main>
<footer id="site-footer"></footer>
<script src="assets/nondim.js"></script>
</body>
</html>
