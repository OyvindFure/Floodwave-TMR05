<!doctype html>
<html lang="nn" data-title="rs.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results</title>
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/pyplot.css?v=8">
<link rel="stylesheet" href="assets/results.css?v=10">
<script src="assets/site.js?v=8"></script>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="wrap">
  <h1 data-i18n="rs.h1"></h1>
  <p class="sub" data-i18n="rs.sub"></p>

  <div class="card">
    <h2 data-i18n="rs.len_h"></h2>
    <p class="small" data-i18n="rs.len_p"></p>
    <div class="pickbox">
      <b data-i18n="rs.pick_h"></b>
      <div class="small" data-i18n="rs.pick_p"></div>
      <div id="pickdev"></div>
    </div>
    <ul class="findings">
      <li data-i18n="rs.f1"></li>
      <li data-i18n="rs.f2"></li>
      <li data-i18n="rs.f3"></li>
    </ul>

    <h3 data-i18n="rs.v3_h"></h3>
    <p class="small" data-i18n="rs.v3_len"></p>
    <div class="chips" id="l3chips"></div>
    <div class="card" style="padding:0;overflow:hidden;margin-bottom:6px">
      <figure class="pywin" style="border:0;border-radius:0;margin:0"><div class="tb"><i></i><i></i><i></i><span data-i18n="rs.v3_h"></span></div><canvas id="l3cv"></canvas></figure>
    </div>
    <div class="small" id="l3info"></div>
    <div class="small"><label><input type="checkbox" id="l3stretch" checked> <span data-i18n="rs.v3_stretch"></span></label> &nbsp; <span data-i18n="rs.v3_hint"></span></div>
    <h3 data-i18n="rs.dof"></h3>
    <div class="chips" id="dofchips"></div>

    <div class="resgrid">
      <div><img id="lenimg" alt=""></div>
      <div>
        <h3 data-i18n="rs.tab"></h3>
        <div class="tabwrap" id="restab"></div>
        <p class="small"><span data-i18n="rs.hl"></span> <a class="dl" id="dl" download data-i18n="rs.dl"></a></p>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="rs.mesh_h"></h2>
    <p class="small" data-i18n="rs.mesh_p"></p>
    <div class="pickbox">
      <b data-i18n="rs.mpick_h"></b>
      <div class="small" data-i18n="rs.mpick_p"></div>
      <div id="mpickdev"></div>
    </div>
    <ul class="findings">
      <li data-i18n="rs.mf1"></li>
      <li data-i18n="rs.mf2"></li>
      <li data-i18n="rs.mf3"></li>
    </ul>
    <h3 data-i18n="rs.v3_h"></h3>
    <p class="small" data-i18n="rs.v3_mesh"></p>
    <div class="chips" id="m3chips"></div>
    <div class="card" style="padding:0;overflow:hidden;margin-bottom:6px">
      <figure class="pywin" style="border:0;border-radius:0;margin:0"><div class="tb"><i></i><i></i><i></i><span data-i18n="rs.v3_h"></span></div><canvas id="m3cv"></canvas></figure>
    </div>
    <div class="small" id="m3info"></div>
    <div class="small"><label><input type="checkbox" id="m3stretch" checked> <span data-i18n="rs.v3_stretch"></span></label> &nbsp; <span data-i18n="rs.v3_hint"></span></div>
    <h3 data-i18n="rs.dof"></h3>
    <div class="chips" id="mdofchips"></div>
    <div class="resgrid">
      <div><img id="meshimg" alt=""></div>
      <div>
        <h3 data-i18n="rs.tab"></h3>
        <div class="tabwrap" id="meshtab"></div>
        <p class="small"><span data-i18n="rs.mhl"></span> <a class="dl" id="mdl" download data-i18n="rs.dl"></a></p>
      </div>
    </div>
  </div>
  <div class="card">
    <h2 data-i18n="ms.h"></h2>
    <p class="small" data-i18n="ms.p"></p>
    <p class="small" data-i18n="ms.warn"></p>
    <div class="msgrid">
      <div><h3 data-i18n="ms.coef"></h3><img id="msimg1" alt=""></div>
      <div><h3 data-i18n="ms.waves"></h3><img id="msimg2" alt=""></div>
    </div>
    <p class="small"><a class="dl" id="msdl" download data-i18n="rs.dl"></a></p>

    <h2 style="margin-top:20px" data-i18n="wv.h"></h2>
    <p class="small" data-i18n="wv.p"></p>
    <div class="chips" id="wvdof"></div>
    <div class="wvctl"><label for="wvom" data-i18n="wv.omega"></label> <input id="wvom" type="range"> <output id="wvomo"></output> <button type="button" id="wvplay"></button></div>
    <div class="small" id="wvinfo"></div>
    <div class="card" style="padding:0;overflow:hidden;margin:8px 0 4px"><canvas id="wvfield" class="wvcv"></canvas></div>
    <div class="small" data-i18n="wv.field"></div>
    <div class="card" style="padding:0;overflow:hidden;margin:8px 0 4px"><canvas id="wvlag" class="wvcv"></canvas></div>
    <div class="small" data-i18n="wv.lag"></div>
    <div class="card" style="padding:0;overflow:hidden;margin:8px 0 4px"><canvas id="wvts" class="wvcv"></canvas></div>
    <div class="small" data-i18n="wv.ts"></div>
    <div class="tabwrap" style="margin-top:10px" id="wvtab"></div>
    <p class="small" data-i18n="wv.note"></p>
  </div>
</div>
</main>
<footer id="site-footer"></footer>
<script src="assets/pyplot.js?v=8"></script>
<script src="assets/results.js?v=10"></script>
<script src="assets/wavesim.js?v=12"></script>
</body>
</html>
