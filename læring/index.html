<!doctype html>
<html lang="nn" data-title="lr.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Læring</title>
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="learning.css">
<script src="../assets/site.js"></script>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="wrap">
  <h1 data-i18n="lr.h1"></h1>
  <p class="sub" data-i18n="lr.sub"></p>

  <div class="card">
    <h2 data-i18n="lr.h_1"></h2>
    <p data-i18n="lr.p_1a"></p>
    <p data-i18n="lr.p_1b"></p>
    <figure><img src="img/length_overshoot_sway.png" alt=""><figcaption data-i18n="lr.c_1"></figcaption></figure>
    <h3 data-i18n="lr.b_h"></h3>
    <p class="small" data-i18n="lr.b_p"></p>
    <div class="barge">
      <svg id="bargeSvg" viewBox="0 0 900 250" role="img" aria-label="Barge and wave"></svg>
      <div class="bctl"><label for="bL"><span data-i18n="lr.b_len"></span> L/λ = <output id="bOut">0.50</output></label>
        <input id="bL" type="range" min="0.1" max="2.5" step="0.01" value="0.5"></div>
      <div class="bread" id="bRead"></div>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="lr.h_2"></h2>
    <p data-i18n="lr.p_2a"></p>
    <p class="small" data-i18n="lr.p_2b"></p>
  </div>

  <div class="card">
    <h2 data-i18n="lr.h_3"></h2>
    <p data-i18n="lr.p_3a"></p>
    <p class="small" data-i18n="lr.p_3b"></p>
    <figure><img src="img/main_study_heave_waves.png" alt=""><figcaption data-i18n="lr.c_3"></figcaption></figure>
  </div>

  <div class="card">
    <h2 data-i18n="lr.h_4"></h2>
    <p data-i18n="lr.p_4a"></p>
    <p data-i18n="lr.p_4b"></p>
    <figure><img src="img/main_study_sway_waves.png" alt=""><figcaption data-i18n="lr.c_4"></figcaption></figure>
  </div>
</div>
</main>
<footer id="site-footer"></footer>
<script src="learning.js"></script>
</body>
</html>
